[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "l2c"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/l2c"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
